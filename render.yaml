services:
  - type: web
    name: read-acdmi-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma db push --skip-generate --accept-data-loss && node dist/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        value: read_academy_secret_jwt_key_sahiwal_2026
      - key: FRONTEND_URL
        value: https://read-acdmi.vercel.app
